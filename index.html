<script>
const API = '', T = 20000, SH = ['▲', '◆', '●', '■'];
const $ = id => document.getElementById(id), em = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'), esc = t => String(t).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const ic = (n, c = '') => `<svg class="ico ${c}"><use href="#i-${n}"/></svg>`, OSN = [['win', 'Windows'], ['linux', 'Linux'], ['cisco', 'Cisco IOS']];
const dg = (n, m) => {
  const W = 540, y = 58, g = (W - 90) / (n.length - 1), x = i => 45 + i * g, e = n.length - 1, pth = (a, b) => `M${x(a)} ${y}L${x(b)} ${y}`;

  let s = `<svg viewBox="0 0 ${W} 135" class="dg">`;
  for (let i = 0; i < e; i++) s += `<line class="lk" x1="${x(i)}" y1="${y}" x2="${x(i + 1)}" y2="${y}"/>`;
  n.forEach((v, i) => { s += `<circle class="nd" cx="${x(i)}" cy="${y}" r="24"/><use href="#i-${v[1]}" x="${x(i) - 12}" y="${y - 12}" width="24" height="24"/><text x="${x(i)}" y="${y + 44}">${v[0]}</text>${v[2] ? `<text class="sb" x="${x(i)}" y="${y + 58}">${v[2]}</text>` : ''}`; });

  else if (m === 'trace') for (let i = 1; i <= e; i++) s += dot(pth(0, i), 2.4, (i - 1) * 0.8, 1) + `<text class="tt" x="${x(i)}" y="${y - 34}">TTL=${i}</text>`;
  else s += dot(pth(0, e), 3, 0);
  return s + '</svg>';
};

const SL = [
 {i:'bolt',a:'#4ade80',hero:1,t:'Juegos de Supervivencia',w:'Redes de Computadores · Grupo 3',p:['Avanza con **▶** o **desliza**','Al final: **quiz de 10 preguntas**']},
 {i:'ip',a:'#22d3ee',t:'IP y direccionamiento',w:'Meléndez',b:['Es la **dirección lógica** de un equipo en la red (**capa 3**). La **MAC** es su identidad física dentro de la LAN.','La **máscara** separa **red** y **host**: si el destino es de tu red usas **ARP** y envías directo; si no, lo mandas al **gateway**.','**IP = Internet Protocol**, «protocolo entre redes»: las reglas para direccionar paquetes de una red a otra.'],an:'IP es la dirección de la casa, la MAC el nombre de quien vive y la máscara el código postal.',p:['**IP** (capa 3) identifica en la red; **MAC** (capa 2, 48 bits) solo dentro de la LAN','Privadas: **10/8** · **172.16/12** · **192.168/16** · Loopback **127.0.0.1** · APIPA **169.254.x.x**','**/24** = 254 equipos · **/26** = 62 · **/30** = 2','**DHCP = DORA** (UDP 67/68) · **ARP** pregunta: ¿quién tiene esta IP?'],c:['ipconfig /all · arp -a','ip -br a · ip neigh','show ip interface brief · show ip arp'],
  g:'<div class="oct"><span class="net">192</span>.<span class="net">168</span>.<span class="net">1</span>.<span class="hst">10</span><em>/24</em></div><div class="cap"><span class="net">red</span> 255.255.255.0 <span class="hst">host</span></div>'},
 {i:'ping',a:'#4ade80',t:'Ping e ICMP',w:'Meléndez',b:['Una prueba que dice si un destino **responde**, cuánto tarda (**RTT**) y cuántos paquetes se **pierden**.','Envía un **ICMP Echo Request (8)** y espera el **Echo Reply (0)**. Cada router en el camino resta **1 al TTL**.','Su autor, Mike Muuss, lo nombró por el **sonar**: se lanza un pulso y se espera el eco.'],an:'Gritar «¡HOLA!» en una cueva y medir cuánto tarda el eco.',p:['**ICMP** Echo Request (8) / Echo Reply (0): capa 3, **sin puertos**','Mide **RTT**, **pérdida** y **TTL** (cada router resta 1)','TTL inicial: Windows **128** · Linux **64** · Cisco **255**','Escalera: 127.0.0.1 → tu IP → gateway → 8.8.8.8 → dominio'],c:['ping -n 4 8.8.8.8','ping -c 4 8.8.8.8','ping 8.8.8.8   (. ! U N &)'],g:dg([['Tu PC','pc'],['Router','rt'],['8.8.8.8','srv']],'ping')},
 {i:'route',a:'#f59e0b',t:'Rutas y enrutamiento',w:'Isaac',b:['La decisión de **por dónde enviar** cada paquete, tomada con la **tabla de enrutamiento** de cada equipo o router.','El router mira solo la **IP destino** y elige la ruta de **máscara más larga** (longest prefix match); si ninguna coincide, usa la **ruta por defecto**.','Ruta viene de «route», camino. Enrutar es **elegir el camino entre redes**.'],an:'Los letreros de una glorieta: «para ir a Santa Marta, por esta calle».',p:['La tabla guarda **red destino**, **siguiente salto**, interfaz y **métrica**','**Longest prefix match**: gana la máscara más larga (**0.0.0.0/0** = por defecto)','**Distancia administrativa**: Conectada **0** · Estática **1** · EIGRP **90** · OSPF **110** · RIP **120**','**Ida y vuelta** necesitan ruta (ruta asimétrica)'],c:['route print','ip route','show ip route'],
  g:'<div class="rt"><div class="r win"><code>172.16.0.0/24</code><span>→ 10.0.0.2</span><b>/24 gana</b></div><div class="r"><code>0.0.0.0/0</code><span>→ 192.168.1.254</span><b>por defecto</b></div></div>'},
 {i:'trace',a:'#fb7185',t:'Traceroute',w:'Isaac',b:['Una herramienta que muestra **cada router (salto)** que cruza un paquete hasta su destino, con su tiempo.','Manda sondas con **TTL 1, 2, 3…**; donde el TTL llega a **0**, ese router responde **ICMP Time Exceeded** y así se descubre el camino.','Trace route = «rastrear la ruta»: dibuja el **mapa salto a salto**.'],an:'Mandar cartas con 1, 2, 3 vidas y anotar dónde muere cada una.',p:['Sondas con **TTL 1, 2, 3…**: el router que lo lleva a 0 responde **ICMP Time Exceeded (11)**','Windows usa ICMP Echo · Linux y Cisco usan UDP a puertos altos','* * * = ese router **no responde** · IPs repetidas = **bucle** · varias IPs = **balanceo**','Último salto: Echo Reply (Windows) / Port Unreachable (Linux)'],c:['tracert -d 8.8.8.8','traceroute -n 8.8.8.8','traceroute 172.16.0.10'],g:dg([['PC','pc'],['R1','rt'],['R2','rt'],['Destino','srv']],'trace')},
 {i:'dns',a:'#a78bfa',t:'DNS',w:'Jesús',b:['El sistema que **traduce nombres** como google.com a **direcciones IP**.','El equipo mira su **caché** y el archivo **hosts**; si no, pregunta al **resolvedor** (**UDP 53**), que consulta **Raíz → TLD → Autoritativo** y guarda la respuesta según su TTL.','**DNS = Domain Name System**, «sistema de nombres de dominio».'],an:'La guía telefónica de internet: buscas el nombre y te da el número.',p:['**Orden:** caché → hosts → resolvedor → Raíz → TLD → Autoritativo','Registros A · AAAA · CNAME · MX · NS · PTR · UDP 53 (TCP 53 si es grande)','TTL del DNS = **segundos** en caché ≠ TTL de IP = **saltos**','ping usa el **resolvedor del SO**; nslookup y dig van **directo al servidor**'],c:['nslookup google.com','dig google.com','show hosts · no ip domain-lookup'],g:dg([['Tu PC','pc'],['Resolvedor','dns','UDP 53'],['Raíz','ip','.'],['TLD','ip','.com'],['Autoritativo','srv','google.com']],'flow')},
 {i:'sock',a:'#38bdf8',t:'Sockets y puertos',w:'Jesús',b:['El punto exacto donde un programa envía o recibe datos: **IP + puerto + protocolo**.','Un programa escucha (**LISTEN**) en un puerto; al llegar un cliente pasa a **ESTABLISHED**, y al cerrar queda un rato en **TIME_WAIT**.','Socket significa **«enchufe»**: el punto donde un programa se conecta a la red.'],an:'Edificio + apartamento + tipo de entrega: la IP es el edificio y el puerto el apartamento.',p:['**Socket = IP + puerto + protocolo** · TCP: tupla de 5','**0.0.0.0**:3000 = toda la red · **127.0.0.1**:3000 = solo local','Estados: LISTEN → SYN → ESTABLISHED → TIME_WAIT','ss usa netlink, netstat lee /proc · Cisco solo ve sus propios sockets','Prueba en vivo: netstat/ss muestra los celulares conectados ahora'],c:['netstat -ano','ss -tulnp','show tcp brief'],g:dg([['Celular','phone',':50412'],['Servidor del quiz','srv','0.0.0.0:3000']],'flow')},
 {i:'bolt',a:'#4ade80',t:'Quiz TTL=0',w:'Todos',p:['**6** preguntas · **20 s** cada una','Más rápido = **más puntos**','**Top 3** al final'],q:1}
];

const Q = [
  ['Tu PC muestra 169.254.x.x. ¿Qué pasó?', ['No hubo DHCP (APIPA)', 'Es tu IP pública', 'Es el loopback', 'Falló el switch'], 0],
  ['Cambias de Wi-Fi. ¿Qué cambia?', ['La MAC', 'La IP', 'Ambas', 'Ninguna'], 1],
  ['ping usa…', ['TCP puerto 80', 'UDP 53', 'ICMP, sin puertos', 'ARP'], 2],
  ['En Cisco el primer ping da .!!!! ¿Por qué?', ['Cable dañado', 'El primer Echo espera el ARP', 'TTL agotado', 'DNS caído'], 1],
  ['Destino en tu LAN y existe 0.0.0.0/0. ¿Cuál ruta gana?', ['La por defecto', 'La local (más específica)', 'La de menor métrica', 'Ninguna'], 1],
  ['¿Qué origen tiene menor distancia administrativa?', ['RIP (120)', 'OSPF (110)', 'EIGRP (90)', 'Estática (1)'], 3],
  ['¿Qué responde el router cuando el TTL llega a 0?', ['Echo Reply', 'ICMP Time Exceeded', 'Port Unreachable', 'SYN-ACK'], 1],
  ['Un salto muestra * * * pero el destino responde. ¿Hay falla?', ['Sí, ruta cortada', 'No, ese router no responde sondas', 'Hay un bucle', 'Falla el DNS'], 1],
  ['Escribes mal un comando en Cisco y se congela. ¿Por qué?', ['Intenta resolverlo por DNS', 'Pierde el ARP', 'Venció el DHCP', 'La interfaz cayó'], 0],
  ['¿Qué diferencia a 0.0.0.0:3000 de 127.0.0.1:3000?', ['Son iguales', '0.0.0.0 acepta de toda la red', '127.0.0.1 acepta celulares', '0.0.0.0 es solo UDP'], 1]
];

const hd = s => `<div class="hd"><span class="ic">${ic(s.i)}</span><div><div class="who"><span class="av">${s.w[0]}</span>${s.w}</div><h1>${s.t}</h1></div></div>`;
const bs = s => s.b ? `<div class="bs">${['¿Qué es?', '¿Cómo funciona?', '¿Por qué ese nombre?'].map((t, i) => `<div class="bc"><h3>${t}</h3><p>${em(s.b[i])}</p></div>`).join('')}<div class="an"><b>Es como…</b> ${s.an}</div></div>` : '';
const pts = s => `<ul class="pts">${s.p.map(x => `<li>${em(x)}</li>`).join('')}</ul>`;
const osr = s => `<div class="os">${s.c.map((x, k) => `<div class="or ${'wlc'[k]}" data-c="${esc(x.split(/ · |   \(/)[0])}" onclick="cp(this)">${ic(OSN[k][0])}<code>${x}</code></div>`).join('')}</div>`;
const hero = s => `<div class="hero"><div class="big">TTL=0</div><h2>${s.t}</h2><p class="who">${s.w}</p><div class="chips">${OSN.map(([i, n], k) => `<span style="color:var(--${'wlc'[k]})">${ic(i)}${n}</span>`).join('')}</div>${s.p.map(x => `<p>${em(x)}</p>`).join('')}<button class="cta" onclick="go(1)">Empezar</button></div>`;
const card = s => s.hero ? hero(s) : s.q ? hd(s) + pts(s) + '<div class="row"><button class="cta" onclick="nav(\'#quiz\')">Ir al quiz</button></div>' : hd(s) + `<div class="cols"><div class="c1">${s.g ? `<div class="gm">${s.g}</div>` : ''}${s.c ? osr(s) : ''}</div><div class="c2">${bs(s)}<div class="kd">Datos clave</div>${pts(s)}</div></div>`;

let cur = 0, qi = 0, score = 0, hits = 0, tms = 0, nick = localStorage.nm || '', tm, rt, qs = [], t0, lock = 0, tt;
const show = v => { ['sv', 'qv', 'rv'].forEach(i => $(i).hidden = i !== v[0] + 'v'); $('nav').hidden = v !== 'sv'; $('dots').style.visibility = v === 'sv' ? 'visible' : 'hidden'; clearInterval(rt); clearTimeout(tm); };
function slide() {
  const s = SL[cur], n = SL.length - 1 - cur, e = $('ttl');
  if (e.textContent !== String(n)) { e.textContent = n; e.classList.remove('tick'); void e.offsetWidth; e.classList.add('tick'); }
  e.style.color = `hsl(${n * 19},90%,60%)`;
  document.documentElement.style.setProperty('--a', s.a);
  const dd = $('dots'); if (!dd.children.length) dd.innerHTML = SL.map(x => `<i style="--c:${x.a}"></i>`).join('');
  [...dd.children].forEach((x, i) => { x.className = i === cur ? 'on' : i < cur ? 'p' : ''; });
  $('sv').innerHTML = card(s); $('sv').scrollTop = 0;
  $('pg').textContent = (cur + 1) + ' / ' + SL.length; $('pb').disabled = cur === 0; $('nb').disabled = cur === SL.length - 1;
}
const nav = h => { history.replaceState(null, '', h); route(); };
const go = d => nav('#s' + Math.max(0, Math.min(SL.length - 1, cur + d)));
function route() {
  const h = location.hash;
  if (h === '#ranking') return rank();
  if (h === '#quiz') return quizName();
  const m = h.match(/^#s(\d+)$/); cur = m ? Math.min(+m[1], SL.length - 1) : 0;
  show('sv'); slide();
}
function cp(el) { const c = el.dataset.c; navigator.clipboard && navigator.clipboard.writeText(c).then(() => toast('Copiado: ' + c)).catch(() => {}); }
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 2200); }

function quizName() {
  show('qv'); document.documentElement.style.setProperty('--a', '#4ade80');
  $('qv').innerHTML = '<div class="fin"><div class="e">🏁</div><h1>Quiz TTL=0</h1><p>10 preguntas · 20 s cada una</p><input id="nm" maxlength="14" placeholder="Tu nombre" autocomplete="off"><button class="cta" onclick="begin()">Empezar</button><button class="cta alt" onclick="nav(\'#s7\')">Volver a las slides</button></div>';
  $('nm').value = nick;
}
function begin() {
  nick = $('nm').value.trim(); if (!nick) return $('nm').focus(); localStorage.nm = nick;
  qs = Q.map(([q, o, c]) => { const x = o.map((t, k) => [t, k === c]).sort(() => Math.random() - .5); return { q, o: x.map(v => v[0]), c: x.findIndex(v => v[1]) }; }).sort(() => Math.random() - .5);
  qi = 0; score = hits = tms = 0; ask();
}
function ask() {
  if (qi >= qs.length) return fin();
  const q = qs[qi]; lock = 0; t0 = Date.now();
  $('qv').innerHTML = `<span class="qn">Pregunta ${qi + 1} de ${qs.length}</span><span class="sc" id="sc">${score} pts</span><div class="qq">${q.q}</div><div class="bar"><i></i></div><div class="g">${q.o.map((x, k) => `<button class="o o${k}" onclick="pick(${k})"><s>${SH[k]}</s>${x}</button>`).join('')}</div>`;
  $('qv').scrollTop = 0; tm = setTimeout(() => pick(-1), T);
}
function pick(k) {
  if (lock) return; lock = 1; clearTimeout(tm);
  const q = qs[qi], ms = Math.min(T, Date.now() - t0); tms += ms;
  if (k === q.c) { hits++; score += Math.max(500, Math.round(1000 - 500 * ms / T)); }
  document.querySelectorAll('#qv .o').forEach((b, i) => b.classList.add(i === q.c ? 'ok' : i === k ? 'no' : 'dim'));
  $('qv').querySelector('.bar i').style.animationPlayState = 'paused'; $('sc').textContent = score + ' pts';
  tm = setTimeout(() => { qi++; ask(); }, 1400);
}
function fin() {
  $('qv').innerHTML = `<div class="fin"><div class="e">🏁</div><h1>¡Listo, ${esc(nick)}!</h1><p class="big2">${score} pts</p><p>${hits} de ${qs.length} correctas · ${Math.round(tms / 1000)} s</p><p id="ss" class="mono"></p><div class="row"><button class="cta" onclick="nav('#ranking')">Ver clasificación</button><button class="cta alt" onclick="quizName()">Repetir</button></div></div>`;
  send();
}
function send() {
  const e = $('ss'); if (!e) return;
  if (!API) { e.textContent = 'Modo local: sin envío de resultados.'; return; }
  e.textContent = 'Enviando…';
  fetch(API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ n: nick, s: score, c: hits, t: Math.round(tms / 1000) }) })
    .then(() => { if ($('ss')) $('ss').textContent = 'Resultado enviado ✓'; })
    .catch(() => { if ($('ss')) $('ss').innerHTML = 'No se pudo enviar. <a href="#" onclick="send();return false">Reintentar</a>'; });
}
function rank() {
  show('rv'); document.documentElement.style.setProperty('--a', '#22d3ee');
  $('rv').innerHTML = '<h1>Clasificación</h1><div id="rtb">Cargando…</div><div class="row"><button class="cta alt" onclick="load()">Actualizar</button><button class="cta alt" onclick="nav(\'#quiz\')">Quiz</button></div>';
  load(); rt = setInterval(load, 10000);
}
function load() {
  const e = $('rtb'); if (!e) return;
  if (!API) { e.textContent = 'Sin conexión configurada (API vacía).'; return; }
  fetch(API).then(r => r.json()).then(d => {
    e.innerHTML = `<table class="tb"><tr><th>#</th><th>Nombre</th><th>Pts</th><th>OK</th><th>Seg</th></tr>${d.slice(0, 30).map((r, i) => `<tr class="${i < 3 ? 'top' : ''} ${r.n === nick ? 'me' : ''}"><td>${['🥇', '🥈', '🥉'][i] || i + 1}</td><td>${esc(r.n)}</td><td>${r.s}</td><td>${r.c}</td><td>${r.t}</td></tr>`).join('')}</table>`;
  }).catch(() => { e.textContent = 'No se pudo cargar la clasificación.'; });
}

const FE = document.documentElement, rf = FE.requestFullscreen || FE.webkitRequestFullscreen, xf = document.exitFullscreen || document.webkitExitFullscreen, isFs = () => document.fullscreenElement || document.webkitFullscreenElement;
function fs() {
  if (isFs()) return xf.call(document);
  if (!rf) return toast('En iPhone: Compartir → Añadir a pantalla de inicio');
  const p = rf.call(FE, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {});
}
const fsu = () => { $('fl').textContent = isFs() ? 'Salir' : 'Pantalla completa'; };
document.addEventListener('fullscreenchange', fsu); document.addEventListener('webkitfullscreenchange', fsu);
function closeFo() { $('fo').hidden = true; sessionStorage.fo = 1; }
if (matchMedia('(pointer:coarse)').matches && !sessionStorage.fo) {
  $('fo').hidden = false;
  if (!rf) { $('ft').textContent = 'En iPhone: Compartir → Añadir a pantalla de inicio para ocultar la barra del navegador.'; $('fy').hidden = true; }
}
let sx = 0, sy = 0;
$('sv').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('sv').addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1); }, { passive: true });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || $('sv').hidden) return; if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); } else if (e.key === 'ArrowLeft') go(-1); });
addEventListener('hashchange', route);
route();
</script>
