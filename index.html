  if (OS === 'c') k = k.replace(/^sh /, 'show ').replace(/ int /, ' interface ').replace(/ br$/, ' brief');
  const [c, ...a] = k.split(/\s+/);
  if (c === 'clear' || c === 'cls') { $('o').innerHTML = ''; return; }
  if (c === 'help') return emit([HELP[OS], 'Destinos: 8.8.8.8 · google.com · web.local · 172.16.0.10'], 0);
  const ok = { w: ['ping', 'tracert', 'nslookup', 'netstat', 'ipconfig', 'route'], l: ['ping', 'traceroute', 'nslookup', 'dig', 'ss', 'ip'], c: ['ping', 'traceroute', 'show'] }[OS];
  busy = 1;
  try {
    if (!ok.includes(c)) {
      if (OS === 'c') { out(`Translating "${c}"...domain server (255.255.255.255)`); await sleep(1800); out('% Unknown command or computer name, or unable to find computer address'); }
      else out(OS === 'w' ? `'${c}' no se reconoce como un comando interno o externo.` : `bash: ${c}: command not found`);
    }
    else if (c === 'ping') await ping(a);
    else if (c === 'tracert' || c === 'traceroute') await trace(a);
    else if (c === 'nslookup' || c === 'dig') await dns(c, a);
    else if (c === 'netstat' || c === 'ss' || k.startsWith('show tcp')) await sock();
    else if (c === 'ipconfig' || k.startsWith('ip -br') || k.startsWith('ip a') || k === 'show ip interface brief') await ipc();
    else if (c === 'route' || k === 'ip route' || k === 'show ip route') await rt();
    else if (k === 'show hosts') await emit(['Name servers are 8.8.8.8', 'Host   Port Flags      Age Type Address(es)', 'WEB    None (perm, OK) 0   IP   172.16.0.10'], 0);
    else out(OS === 'c' ? "% Invalid input detected at '^' marker." : 'Comando no incluido en la demo: escribe help');
  } finally { busy = 0; }
}

const setP = () => { $('pr').textContent = P[OS]; };
function otabs() { $('otabs').innerHTML = OSN.map(([i, n], k) => `<button class="t${'wlc'[k]} ${'wlc'[k] === OS ? 'on' : ''}" onclick="setOS('${'wlc'[k]}')">${ic(i)}<span>${n}</span></button>`).join(''); setP(); chips(); }
function setOS(k) { OS = k; $('o').innerHTML = ''; otabs(); }
function chips() { const s = SL[cur], k = 'wlc'.indexOf(OS), c = s && s.c ? [s.c[k].split(/ · |   \(/)[0]] : []; $('ch').innerHTML = [...c, 'help', 'clear'].map(x => `<button onclick="run(this.textContent)">${esc(x)}</button>`).join(''); }
$('in').onkeydown = e => { if (e.key === 'Enter') { run($('in').value); $('in').value = ''; } };
out('// toca un comando o escribe help');

const hd = s => `<div class="hd"><span class="ic">${ic(s.i)}</span><div><div class="who"><span class="av">${s.w[0]}</span>${s.w}</div><h1>${s.t}</h1></div></div>`;
const bs = s => `<div class="bs">${['¿Qué es?', '¿Cómo funciona?', '¿Por qué ese nombre?'].map((t, i) => `<div class="bc"><h3>${t}</h3><p>${em(s.b[i])}</p></div>`).join('')}<div class="an"><b>Es como…</b> ${s.an}</div></div>`;
const pts = s => `<ul class="pts">${s.p.map(x => `<li>${em(x)}</li>`).join('')}</ul>`;
const hero = s => `<div class="hero"><div class="big">TTL=0</div><h2>${s.t}</h2><p class="who">${s.w}</p><div class="chips">${OSN.map(([i, n], k) => `<span style="color:var(--${'wlc'[k]})">${ic(i)}${n}</span>`).join('')}</div>${s.p.map(x => `<p>${em(x)}</p>`).join('')}<button class="cta adm" onclick="go(1)">Empezar</button><p class="wt">Esperando al presentador…</p></div>`;
const last = s => `<div class="hero">${hd(s)}${pts(s)}<button class="cta adm" onclick="nav('#quiz')">Ir al quiz</button><p class="wt">Esperando al presentador…</p></div>`;

let cur = 0, qi = 0, score = 0, hits = 0, tms = 0, nick = localStorage.nm || '', tm, rti, qs = [], t0, lock = 0, tt, FR = null, rz;
function fit(root, box) {
  FR = [root, box]; root.classList.add('nofx');
  let f = Math.max(13, Math.min(34, innerWidth / 50, innerHeight / 24));
  root.style.fontSize = f + 'px';
  while (box.scrollHeight > box.clientHeight + 1 && f > 8) { f -= .5; root.style.fontSize = f + 'px'; }
  root.classList.remove('nofx');
}
const show = v => { ['sv', 'qv', 'rv'].forEach(i => $(i).hidden = i !== v + 'v'); $('ctl').hidden = $('dots').hidden = v !== 's'; $('tmh').appendChild($('tm')); clearInterval(rti); clearTimeout(tm); };
function panel() {
  const s = SL[cur];
  $('tmh').appendChild($('tm'));
  $('sv').innerHTML = `<div class="sl"><div class="t2">${hd(s)}</div><div class="pn"><div class="cx two"><div class="rc">${bs(s)}<div class="gm">${s.g}</div></div></div></div></div>`;
  const pn = $('sv').querySelector('.pn');
  pn.querySelector('.cx').prepend($('tm'));
  otabs();
  fit($('sv').firstChild, pn);
}
function slide() {
  const s = SL[cur], n = SL.length - 1 - cur, e = $('ttl');
  if (e.textContent !== String(n)) { e.textContent = n; e.classList.remove('tick'); void e.offsetWidth; e.classList.add('tick'); }
  e.style.color = `hsl(${n * 19},90%,60%)`;
  document.documentElement.style.setProperty('--a', s.a);
  const dd = $('dots'); if (!dd.children.length) dd.innerHTML = SL.map(x => `<i style="--c:${x.a}"></i>`).join('');
  [...dd.children].forEach((x, i) => { x.className = i === cur ? 'on' : i < cur ? 'p' : ''; });
  $('pb').disabled = cur === 0; $('nb').disabled = cur === SL.length - 1;
  if (s.hero || s.q) { $('sv').innerHTML = s.hero ? hero(s) : last(s); fit($('sv'), $('sv')); }
  else panel();
}
let ADM = 0, CTRL = 0, PIN = '', lastV = '', playOn = 0, HH = '#s0', pt;
const free = () => ADM || !CTRL;
const navTo = h => { HH = h; history.replaceState(null, '', h); route(); };
const nav = h => { if (!free() && h !== '#ranking') return; if (ADM) push(h.slice(1)); navTo(h); };
const go = d => { if (!free()) return; $('sv').style.setProperty('--dx', d < 0 ? '-48px' : '48px'); nav('#s' + Math.max(0, Math.min(SL.length - 1, cur + d))); };
function push(v) {
  lastV = v; playOn = v === 'play';
  if (API) fetch(API + '?a=set&k=' + encodeURIComponent(PIN) + '&v=' + v + '&t=' + Date.now(), { mode: 'no-cors', keepalive: true }).catch(() => {});
}
function apply(v) {
  v = v || 's0'; if (v === lastV) return; lastV = v; playOn = v === 'play';
  if (v === 'play' && !$('qv').hidden && $('nm')) return unlock();
  const m = v.match(/^s(\d+)$/); if (m) $('sv').style.setProperty('--dx', +m[1] < cur ? '-48px' : '48px');
  navTo(v === 'play' ? '#quiz' : '#' + v);
}
function setMode() {
  document.body.classList.toggle('lk', !!CTRL && !ADM); document.body.classList.toggle('ad', !!ADM);
  const b = $('adb'); b.className = ADM ? 'ad' : CTRL ? 'lv' : ''; b.textContent = ADM ? 'ADMIN' : CTRL ? 'EN VIVO' : '';
}
function poll() {
  if (!API) return;
  fetch(API + '?a=get&_=' + Date.now()).then(r => r.json()).then(d => {
    if (!d || typeof d.v !== 'string') return;
    if (!CTRL) { CTRL = 1; setMode(); }
    if (!ADM) { $('adb').className = 'lv'; $('adb').textContent = 'EN VIVO'; }
    if (!ADM || !lastV) apply(d.v);
  }).catch(() => { if (!ADM && CTRL) { $('adb').className = 'off'; $('adb').textContent = 'RECONECTANDO'; } });
}
async function boot() {
  if (location.hash === '#salir') { localStorage.removeItem('adm'); history.replaceState(null, '', '#s0'); }
  if (API && (location.hash === '#admin' || localStorage.adm)) {
    const k = localStorage.adm || prompt('Clave de administrador:') || '';
    if (k) {
      try {
        const d = await (await fetch(API + '?a=chk&k=' + encodeURIComponent(k))).json();
        if (d && d.ok) { ADM = 1; CTRL = 1; PIN = k; localStorage.adm = k; } else { localStorage.removeItem('adm'); toast('Clave incorrecta'); }
      } catch (e) {}
    }
    if (location.hash === '#admin') history.replaceState(null, '', '#s0');
  }
  setMode(); route(); poll();
  if (!ADM) pt = setInterval(poll, 3000);
}
function route() {
  const h = location.hash;
  if (h === '#ranking') return rank();
  if (h === '#quiz') return quizName();
  const m = h.match(/^#s(\d+)$/); cur = m ? Math.min(+m[1], SL.length - 1) : 0;
  show('s'); slide();
}
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 2200); }

function quizName() {
  show('q'); document.documentElement.style.setProperty('--a', '#4ade80');
  const w = !ADM && CTRL && !playOn;
  $('qv').innerHTML = `<div class="fin"><div class="e">📝</div><h1>Quiz de repaso</h1><p>10 preguntas · 20 s cada una</p><input id="nm" maxlength="14" placeholder="Tu nombre" autocomplete="off"><button id="go" class="cta" onclick="begin()"${w ? ' disabled' : ''}>${w ? 'Esperando al presentador…' : 'Empezar'}</button><button class="cta ao" onclick="startAll()">Iniciar para todos</button><button class="cta alt ao" onclick="nav('#ranking')">Ver clasificación</button><button class="cta alt adm" onclick="nav('#s7')">Volver a las slides</button></div>`;
  $('nm').value = nick; fit($('qv'), $('qv'));
}
function startAll() { push('play'); toast('Quiz iniciado para todos'); }
function unlock() {
  const b = $('go'); if (b) { b.disabled = false; b.textContent = 'Empezar'; }
  if ($('nm') && $('nm').value.trim()) begin();
}
function begin() {
  nick = $('nm').value.trim(); if (!nick) return $('nm').focus(); localStorage.nm = nick;
  qs = Q.map(([q, o, c]) => { const x = o.map((t, k) => [t, k === c]).sort(() => Math.random() - .5); return { q, o: x.map(v => v[0]), c: x.findIndex(v => v[1]) }; }).sort(() => Math.random() - .5);
  qi = 0; score = hits = tms = 0; ask();
}
function ask() {
  if (qi >= qs.length) return fin();
  const q = qs[qi]; lock = 0; t0 = Date.now();
  $('qv').innerHTML = `<div class="qw"><div><span class="qn">Pregunta ${qi + 1} de ${qs.length}</span><span class="sc" id="sc">${score} pts</span></div><div class="qq">${q.q}</div><div class="bar"><i></i></div><div class="g">${q.o.map((x, k) => `<button class="o o${k}" onclick="pick(${k})"><s>${SH[k]}</s>${x}</button>`).join('')}</div></div>`;
  fit($('qv'), $('qv')); tm = setTimeout(() => pick(-1), T);
}
function pick(k) {
  if (lock) return; lock = 1; clearTimeout(tm);
  const q = qs[qi], ms = Math.min(T, Date.now() - t0); tms += ms;
  if (k === q.c) { hits++; score += Math.max(500, Math.round(1000 - 500 * ms / T)); }
  document.querySelectorAll('#qv .o').forEach((b, i) => b.classList.add(i === q.c ? 'ok' : i === k ? 'no' : 'dim'));
  $('qv').querySelector('.bar i').style.animationPlayState = 'paused'; $('sc').textContent = score + ' pts';
  if (k === q.c) { $('sc').classList.remove('bump'); void $('sc').offsetWidth; $('sc').classList.add('bump'); }
  tm = setTimeout(() => { qi++; ask(); }, 1400);
}
function fin() {
  $('qv').innerHTML = `<div class="fin"><div class="e">✅</div><h1>¡Listo, ${esc(nick)}!</h1><p class="big2">${score} pts</p><p>${hits} de ${qs.length} correctas · ${Math.round(tms / 1000)} s</p><p id="ss" class="mono"></p><div class="row"><button class="cta" onclick="nav('#ranking')">Ver clasificación</button><button class="cta alt" onclick="quizName()">Repetir</button></div></div>`;
  fit($('qv'), $('qv')); send(); count(document.querySelector('.big2'), score);
}
function count(el, to) {
  if (!el || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const t0 = performance.now(), step = t => { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + ' pts'; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function send() {
  const e = $('ss'); if (!e) return;
  if (!API) { e.textContent = 'Modo local: sin envío de resultados.'; return; }
  e.textContent = 'Enviando…';
  fetch(API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ n: nick, s: score, c: hits, t: Math.round(tms / 1000) }) })
    .then(() => { if ($('ss')) $('ss').textContent = 'Resultado enviado ✓'; })
    .catch(() => { if ($('ss')) $('ss').innerHTML = 'No se pudo enviar. <a href="#" onclick="send();return false">Reintentar</a>'; });
}
let rkd = 0;
function rank() {
  rkd = 0; show('r'); document.documentElement.style.setProperty('--a', '#22d3ee');
  $('rv').innerHTML = '<h1>Clasificación</h1><div id="rtb">Cargando…</div><div class="row"><button class="cta alt" onclick="load()">Actualizar</button><button class="cta alt adm" onclick="nav(\'#quiz\')">Quiz</button></div>';
  fit($('rv'), $('rv')); load(); rti = setInterval(load, 10000);
}
function load() {
  const e = $('rtb'); if (!e) return;
  if (!API) { e.textContent = 'Sin conexión configurada (API vacía).'; return; }
  fetch(API).then(r => r.json()).then(d => {
    e.innerHTML = `<table class="tb${rkd ? '' : ' in'}"><tr><th>#</th><th>Nombre</th><th>Pts</th><th>OK</th><th>Seg</th></tr>${d.slice(0, 10).map((r, i) => `<tr style="--i:${i}" class="${i < 3 ? 'top' : ''} ${r.n === nick ? 'me' : ''}"><td>${['🥇', '🥈', '🥉'][i] || i + 1}</td><td>${esc(r.n)}</td><td>${r.s}</td><td>${r.c}</td><td>${r.t}</td></tr>`).join('')}</table>`;
    rkd = 1; fit($('rv'), $('rv'));
  }).catch(() => { e.textContent = 'No se pudo cargar la clasificación.'; });
}

const FE = document.documentElement, rf = FE.requestFullscreen || FE.webkitRequestFullscreen, xf = document.exitFullscreen || document.webkitExitFullscreen, isFs = () => document.fullscreenElement || document.webkitFullscreenElement;
function fs() {
  if (isFs()) return xf.call(document);
  if (!rf) return toast('En iPhone: Compartir → Añadir a pantalla de inicio');
  const p = rf.call(FE, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {});
}
function closeFo() { $('fo').hidden = true; sessionStorage.fo = 1; }
if (matchMedia('(pointer:coarse)').matches && !sessionStorage.fo) {
  $('fo').hidden = false;
  if (!rf) { $('ft').textContent = 'En iPhone: Compartir → Añadir a pantalla de inicio para ocultar la barra del navegador.'; $('fy').hidden = true; }
}
let sx = 0, sy = 0;
$('sv').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('sv').addEventListener('touchend', e => { if (e.target.closest('#tm')) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1); }, { passive: true });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || $('sv').hidden) return; if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); });
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (FR && FR[0].isConnected && document.activeElement !== $('in')) fit(FR[0], FR[1]); }, 150); });
addEventListener('hashchange', () => { if (free()) route(); else if (location.hash !== HH) history.replaceState(null, '', HH); });
boot();
</script>
